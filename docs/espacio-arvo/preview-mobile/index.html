<!doctype html><html lang="es"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Vista móvil de la demo</title><style>html,body{margin:0;background:white;width:390px}iframe{display:block;width:390px;height:100px;border:0}</style><iframe title="Demo en viewport móvil de 390px" src="../"></iframe><script>const frame=document.querySelector('iframe');function fit(){frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px'}frame.addEventListener('load',()=>{fit();new ResizeObserver(fit).observe(frame.contentDocument.body)});</script></html>
