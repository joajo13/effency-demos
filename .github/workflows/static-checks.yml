name: Check isolated static demos
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run check:passiflora
      - name: Check JavaScript syntax
        run: find docs scripts -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
